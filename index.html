<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人首頁</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1114;
            --bg-card: #1e2227;
            --accent-gold: #f4c45f;
            --accent-blue: #4facfe;
            --text-main: #e0e6ed;
            --text-muted: #8892b0;
            --glass-border: rgba(255, 255, 255, 0.08);
            --hover-shadow: rgba(244, 196, 95, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(74, 144, 226, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(244, 196, 95, 0.05) 0%, transparent 20%);
            color: var(--text-main);
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 60px 20px;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 標題區域 */
        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 5px;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--accent-gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        /* 分組標題 */
        .category-container {
            margin-bottom: 40px;
        }

        .category-title {
            color: var(--accent-gold);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            padding-left: 10px;
        }

        .category-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(244, 196, 95, 0.3), transparent);
            margin-left: 20px;
        }

        /* 網格系統 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* 卡片設計 */
        .menu-item {
            background: var(--bg-card);
            text-decoration: none;
            padding: 24px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .menu-item::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(244, 196, 95, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* 圖示 */
        .icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            margin-right: 20px;
            z-index: 1;
            transition: all 0.4s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .label-container {
            z-index: 1;
        }

        .id-tag {
            font-size: 0.7rem;
            color: var(--accent-gold);
            font-weight: 700;
            opacity: 0.6;
            margin-bottom: 4px;
            display: block;
        }

        .label {
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        /* 懸停效果 */
        .menu-item:hover {
            transform: translateY(-5px);
            border-color: rgba(244, 196, 95, 0.5);
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.5), 0 0 15px var(--hover-shadow);
        }

        .menu-item:hover::before {
            opacity: 1;
        }

        .menu-item:hover .icon {
            background: var(--accent-gold);
            transform: scale(1.1) rotate(-5deg);
            color: #000;
            box-shadow: 0 5px 15px rgba(244, 196, 95, 0.3);
        }

        .menu-item:active {
            transform: scale(0.97);
        }

        /* 頁腳 */
        footer {
            text-align: center;
            margin-top: 80px;
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* 響應式優化 */
        @media (max-width: 600px) {
            body { padding: 40px 15px; }
            .header h1 { font-size: 1.6rem; }
            .menu-grid { grid-template-columns: 1fr; }
            .menu-item { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>Personal Dashboard</h1>
            <div class="subtitle">INTELLIGENT INVESTMENT NAVIGATION</div>
        </header>

        <section class="category-container">
            <div class="category-title">核心工具 / Core Tools</div>
            <nav class="menu-grid">
                <a href="https://pchome.megatime.com.tw/rank/" target="_blank" class="menu-item">
                    <span class="icon">🚀</span>
                    <div class="label-container">
                        <span class="id-tag">01</span>
                        <span class="label">股票各式排行 [PChome]</span>
                    </div>
                </a>
                
                <a href="https://mops.twse.com.tw/mops/" target="_blank" class="menu-item">
                    <span class="icon">🗃️</span>
                    <div class="label-container">
                        <span class="id-tag">02</span>
                        <span class="label">公開資訊觀測站</span>
                    </div>
                </a>

                <a href="https://mis.twse.com.tw/stock/various-areas/etf-price/indicator-disclosure-etf?lang=zhHant" target="_blank" class="menu-item">
                    <span class="icon">🔍</span>
                    <div class="label-container">
                        <span class="id-tag">03</span>
                        <span class="label">ETF 淨值揭露專區</span>
                    </div>
                </a>
            </nav>
        </section>

        <footer>
            &copy; 2026 Hubert System. All rights reserved.
        </footer>
    </div>

</body>
</html>
